<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Iʿrāb Ambiguity Annotation</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="https://cdn.tailwindcss.com"></script>
<style>
  body { font-family: -apple-system, system-ui, sans-serif; }
  .arabic { font-family: "Amiri", "Noto Naskh Arabic", "Times New Roman", serif;
            direction: rtl; font-size: 1.6rem; line-height: 1.8; }
  pre { white-space: pre-wrap; }
</style>
</head>
<body class="bg-slate-50 min-h-screen">
<header class="bg-white border-b">
  <div class="max-w-5xl mx-auto px-4 py-3 flex items-center gap-4">
    <h1 class="text-lg font-semibold">Ambiguity Annotation</h1>
    <input id="annId" placeholder="annotator id"
           class="border rounded px-2 py-1 text-sm">
    <select id="kindSel" class="border rounded px-2 py-1 text-sm"></select>
    <button id="reload" class="bg-sky-500 text-white px-3 py-1 rounded text-sm">Load</button>
    <span id="stats" class="text-xs text-slate-500"></span>
  </div>
</header>
<main class="max-w-5xl mx-auto p-4 space-y-4">
<div id="card" class="bg-white border rounded-lg p-4">
  <p class="text-slate-500">Pick a kind and press Load.</p>
</div>
</main>
<script>
const KINDS = ["idafa_attachment","preposition_vs_idafa","coordination_scope",
               "latent_governor","nested_attachment","omitted_element",
               "semantic_role_overlap"];
const $ = sel => document.querySelector(sel);

KINDS.forEach(k => {
  const o = document.createElement("option"); o.value = k; o.textContent = k;
  $("#kindSel").appendChild(o);
});

let pending = [];
let pos = 0;

async function load() {
  const k = $("#kindSel").value;
  const r = await fetch(`/api/queue/${k}/pending?limit=50`).then(r => r.json());
  pending = r.items || [];
  pos = 0;
  $("#stats").textContent = `${pending.length} pending`;
  render();
}

function render() {
  if (!pending.length) {
    $("#card").innerHTML = '<p class="text-slate-500">queue empty</p>';
    return;
  }
  if (pos >= pending.length) {
    $("#card").innerHTML = '<p class="text-emerald-600">end of queue ✓</p>';
    return;
  }
  const it = pending[pos];
  const e = it.example;
  const primary = JSON.stringify(e.primary_analysis, null, 2);
  const secondary = JSON.stringify(e.secondary_analyses, null, 2);
  $("#card").innerHTML = `
    <div class="text-xs text-slate-500">
      ${pos + 1} / ${pending.length} · <code>${e.ambiguity_id}</code>
    </div>
    <div class="text-sm mt-1">kind: <b>${e.ambiguity_kind}</b> · span: ${e.span_tokens.join(",")}</div>
    <div class="mt-3">
      <div class="text-xs text-slate-500 mb-1">Primary analysis (model):</div>
      <pre class="text-xs bg-slate-100 p-2 rounded">${primary}</pre>
    </div>
    <div class="mt-2">
      <div class="text-xs text-slate-500 mb-1">Secondary (alternative) analyses:</div>
      <pre class="text-xs bg-slate-100 p-2 rounded">${secondary}</pre>
    </div>
    <div class="mt-2 text-xs text-slate-500">
      Note: ${e.reasoning_note || "—"}
    </div>
    <div class="mt-4 flex gap-2">
      <button onclick="act('confirm')" class="bg-emerald-500 text-white px-3 py-1 rounded text-sm">Confirm primary</button>
      <button onclick="act('reject')"  class="bg-red-500 text-white px-3 py-1 rounded text-sm">Reject (not ambiguous)</button>
      <button onclick="act('multi')"   class="bg-amber-500 text-white px-3 py-1 rounded text-sm">Mark genuinely ambiguous (both valid)</button>
      <button onclick="next()"         class="bg-slate-400 text-white px-3 py-1 rounded text-sm">Skip</button>
    </div>`;
}

async function act(kind) {
  const it = pending[pos];
  if (!it) return;
  const aid = $("#annId").value || "anon";
  const k = $("#kindSel").value;
  const body = JSON.stringify({
    ambiguity_id: it.example.ambiguity_id, annotator_id: aid,
    notes: kind === "multi" ? "BOTH_VALID" : "",
    reason: kind === "reject" ? "not actually ambiguous" : "",
  });
  const path = kind === "reject" ? "reject" : "confirm";
  await fetch(`/api/queue/${k}/${path}`, {
    method: "POST", headers: {"content-type": "application/json"}, body
  });
  next();
}

function next() { pos += 1; render(); }
$("#reload").addEventListener("click", load);
$("#kindSel").addEventListener("change", load);
load();
</script>
</body>
</html>
