# Phase 3: structured-prediction v1 rebuild.
# AraT5v2-base encoder + 4 classification heads (case / role / marker / POS),
# trained on the canonicalized 5K-sentence / 77K-word distill_v2 corpus.
#
# Designed for the Bocconi `stud` MIG slice (~22-40 GB).

encoder_name: UBC-NLP/AraT5v2-base-1024
train_path: data/structured_v1/train.jsonl
val_path: data/structured_v1/val.jsonl

max_subwords: 320
max_words: 64
head_dropout: 0.1
loss_weights: [1.0, 1.5, 1.0, 0.5]   # case, role, marker, pos — bump role weight

# Targeted upgrades (rev 2):
label_smoothing: 0.1
role_class_weighting: sqrt_inv_freq    # rebalance long-tail role classes
pooling_strategy: first                # first-subtoken pooling for token classification

# Phase 4 (TESTED, REGRESSED — disabled by default).
# Linear-chain CRF on the role head (replaces independent CE), initialised
# from training-corpus role bigram log-probabilities. The CRF code lives in
# src/irab_tashkeel/structured/crf.py and is fully wired (model.py +
# train.py + structured_predictor.py); set use_crf_role: true to retrain
# with it. Phase 4 retrain (jobid 490933): Gazelle case 50.0, role-F1 37.9,
# fully 11.9 — regression vs rev 2 (case 55.2, role-F1 36.9, fully 18.7).
# Hypothesis why: CRF NLL stayed high (~14) at end of 6 epochs vs rev 2's
# ~2; with role class weighting + label smoothing already regularising the
# head, the CRF's transition prior added noise rather than signal at this
# scale. Reported as honest negative result in §5.6 (Phase 4 paragraph).
use_crf_role: false
crf_init_from_bigrams: true

learning_rate: 5.0e-5
weight_decay: 0.01
warmup_ratio: 0.06
num_train_epochs: 6                    # was 3 — best-checkpoint retention covers overfit risk
per_device_train_batch_size: 8
per_device_eval_batch_size: 16
gradient_accumulation_steps: 4
logging_steps: 50
eval_steps: 500
save_total_limit: 1
seed: 42
bf16: true
gradient_checkpointing: false
optim: adamw_torch

# Best-checkpoint retention (eval at epoch end; keep best by `fully`)
load_best_at_end: true
metric_for_best: fully
greater_is_better: true
