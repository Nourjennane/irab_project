# QLoRA SFT on ALLaM-7B-Instruct (alternative Stack A — top AraLingBench).
# Target hardware: A100 40GB+. Bocconi: `gpu` partition, ~10h.

model_id: ALLaM-AI/ALLaM-7B-Instruct-preview
use_flash_attn_2: true

load_in_4bit: true
bnb_4bit_compute_dtype: bfloat16
bnb_4bit_quant_type: nf4
bnb_4bit_use_double_quant: true

lora_r: 32
lora_alpha: 64
lora_dropout: 0.05
lora_target_modules:
  - q_proj
  - k_proj
  - v_proj
  - o_proj
  - gate_proj
  - up_proj
  - down_proj

learning_rate: 2.0e-4
weight_decay: 0.0
warmup_ratio: 0.03
lr_scheduler_type: cosine
n_epochs: 3
per_device_train_batch_size: 1
gradient_accumulation_steps: 16
max_seq_length: 1024

curriculum: [8, 16, null]

dataset_cache: data/cache/combined.pkl
val_split: 0.02
seed: 42
