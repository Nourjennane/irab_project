# Mix A Phase 2 — AraT5v2 marker fine-tune.
# 296M params; fits comfortably on RTX 4060 8GB at batch 16, seq 256.

model_id: UBC-NLP/AraT5v2-base-1024
pairs_path: data/marker_pairs.jsonl
val_split: 0.05

learning_rate: 1.0e-4
weight_decay: 0.01
warmup_ratio: 0.03
n_epochs: 5
per_device_train_batch_size: 4    # tight on RTX 4060 8GB; HPC can lift to 16
per_device_eval_batch_size: 8
gradient_accumulation_steps: 4    # effective batch 16
max_input_length: 256
max_target_length: 32
label_smoothing_factor: 0.1

# Keep <NO_MARKER> in training so the model learns to output it explicitly
# rather than hallucinating a marker for mahall words.
drop_no_marker_in_train: false

seed: 42
